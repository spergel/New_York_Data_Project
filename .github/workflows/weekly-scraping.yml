name: Weekly Academic Events Scraping

on:
  schedule:
    # Run every Sunday at 2 AM UTC (10 PM Saturday EST)
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual triggering

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        cd academic
        pip install -r requirements.txt
        
    - name: Run weekly scraping
      run: |
        cd academic
        python weekly_scraper.py
        
    - name: Commit and push updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # Only commit the Next.js public data file, not the debug files
        git add academic/academic-nextjs/public/scraped_events.json
        git commit -m "🤖 Automated weekly scraping - $(date +'%Y-%m-%d')" || echo "No changes to commit"
        git push
        
    - name: Create summary
      run: |
        echo "## 🤖 Weekly Scraping Complete" >> $GITHUB_STEP_SUMMARY
        echo "- **Date:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
        echo "- **Next run:** Next Sunday at 2 AM UTC" >> $GITHUB_STEP_SUMMARY




