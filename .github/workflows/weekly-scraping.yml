name: Weekly Academic Events Scraping

on:
  schedule:
    # Run every Sunday at 2 AM UTC (10 PM Saturday EST)
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual triggering

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        cd academic
        pip install -r requirements.txt
        
    - name: Run weekly scraping
      run: |
        cd academic
        python weekly_scraper.py
        
    - name: Deploy to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: |
        cd academic/academic-nextjs
        npm install
        npx vercel --prod --token $VERCEL_TOKEN
        
    # Disabled GitHub commit/push - data stored locally only
    # - name: Commit and push updates
    #   run: |
    #     git config --local user.email "action@github.com"
    #     git config --local user.name "GitHub Action"
    #     git add .
    #     git commit -m "🤖 Automated weekly scraping - $(date +'%Y-%m-%d')" || echo "No changes to commit"
    #     git push
        
    - name: Create summary
      run: |
        echo "## 🤖 Weekly Scraping Complete" >> $GITHUB_STEP_SUMMARY
        echo "- **Date:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployment:** Vercel" >> $GITHUB_STEP_SUMMARY
        echo "- **Next run:** Next Sunday at 2 AM UTC" >> $GITHUB_STEP_SUMMARY




