<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Academic Events</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>NYC Academic Events</h1>
            <p>Upcoming academic events from universities and institutions across New York City</p>

            <div class="filters">
                <div class="filter-group">
                    <label for="source-filter">Filter by Institution:</label>
                    <select id="source-filter">
                        <option value="">All Institutions</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="category-filter">Filter by Category:</label>
                    <select id="category-filter">
                        <option value="">All Categories</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="date-filter">Show:</label>
                    <select id="date-filter">
                        <option value="all">All Future Events</option>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                    </select>
                </div>

                <button id="reset-filters" class="btn-secondary">Reset Filters</button>
            </div>
        </header>

        <main>
            <div class="stats">
                <div class="stat">
                    <span class="stat-number" id="total-events">403</span>
                    <span class="stat-label">Total Events</span>
                </div>
                <div class="stat">
                    <span class="stat-number" id="filtered-events">403</span>
                    <span class="stat-label">Showing</span>
                </div>
                <div class="stat">
                    <span class="stat-number" id="unique-sources">24</span>
                    <span class="stat-label">Institutions</span>
                </div>
            </div>

            <div class="events-section">
                <table id="events-table" class="events-table">
                    <thead>
                        <tr>
                            <th onclick="app.sortBy('date')" class="sortable-header">Date</th>
                            <th onclick="app.sortBy('event')" class="sortable-header">Event</th>
                            <th onclick="app.sortBy('institution')" class="sortable-header">Institution</th>
                            <th onclick="app.sortBy('location')" class="sortable-header">Location</th>
                            <th>Category</th>
                        </tr>
                    </thead>
                    <tbody id="events-body">
                        <tr>
                            <td colspan="5">Loading events...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer>
            <p>Data last updated: <span id="last-updated">Loading...</span></p>
            <p><a href="https://github.com/jspergel/New_York_Data_Project">View on GitHub</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
